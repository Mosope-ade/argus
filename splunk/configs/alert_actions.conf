# alert_actions.conf — Webhook alert action config for Argus
# Location on Splunk server:
#   $SPLUNK_HOME/etc/apps/argus/local/alert_actions.conf

[webhook]
param.url = http://localhost:8001/api/agent/investigate
# Replace <WEBHOOK_SECRET> with the value you set in Argus .env
param.user_agent = Splunk/1.0
param.auth = Bearer <WEBHOOK_SECRET>